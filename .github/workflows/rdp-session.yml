name: Arch Desktop Session

on:
  workflow_dispatch:
    inputs:
      session_duration:
        description: 'Session duration (hours)'
        required: true
        default: '1'
        type: choice
        options: ['0.5', '1', '2', '4', '6']
      vnc_password:
        description: 'VNC password (6-8 chars)'
        required: true
        default: 'abc123'

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 370

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Kali Desktop
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/kali-desktop:latest"
          docker run --rm \
            --shm-size=1g \
            -p 6901:6901 \
            -e VNC_PASSWORD="${{ github.event.inputs.vnc_password || 'abc123' }}" \
            -e SESSION_HOURS="${{ github.event.inputs.session_duration }}" \
            -e ZROK_ENABLE_TOKEN="${{ secrets.ZROK_ENABLE_TOKEN }}" \
            "$IMAGE"
